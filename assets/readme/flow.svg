<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">How the suite works</title>
  <desc id="desc">Trim scans, explains, requests host approval, then applies or rolls back. Recipe turns a goal into a validated blueprint and exports it.</desc>
  <rect width="1200" height="330" rx="24" fill="#0b1422"/>
  <rect x="1" y="1" width="1198" height="328" rx="23" fill="none" stroke="#25344d" stroke-width="1.5"/>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', 'Noto Sans CJK SC', sans-serif">
    <text x="48" y="52" fill="#e8f1ff" font-size="24" font-weight="700">两条路径，一个授权边界</text>
    <text x="48" y="80" fill="#7f93b0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" letter-spacing="1.4">TRIM / RECIPE</text>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
      <text x="48" y="128" fill="#8ff0d8" font-size="13" letter-spacing="1.4">TRIM</text>
      <g fill="#0f1c2d" stroke="#2d4f7c">
        <rect x="48" y="146" width="132" height="56" rx="10"/>
        <rect x="204" y="146" width="132" height="56" rx="10"/>
        <rect x="360" y="146" width="150" height="56" rx="10"/>
        <rect x="534" y="146" width="150" height="56" rx="10"/>
      </g>
      <g fill="#dbe9ff" font-size="14" text-anchor="middle">
        <text x="114" y="179">scan</text>
        <text x="270" y="179">explain</text>
        <text x="435" y="179">host approval</text>
        <text x="609" y="179">apply / rollback</text>
      </g>
      <g stroke="#4b6a92" stroke-width="1.6" marker-end="url(#arrow)">
        <path d="M180 174 H198"/>
        <path d="M336 174 H354"/>
        <path d="M510 174 H528"/>
      </g>

      <text x="48" y="252" fill="#ffd782" font-size="13" letter-spacing="1.4">RECIPE</text>
      <g fill="#1b1a10" stroke="#6b5522">
        <rect x="48" y="270" width="132" height="42" rx="10"/>
        <rect x="204" y="270" width="132" height="42" rx="10"/>
        <rect x="360" y="270" width="150" height="42" rx="10"/>
        <rect x="534" y="270" width="150" height="42" rx="10"/>
      </g>
      <g fill="#fff2c6" font-size="13" text-anchor="middle">
        <text x="114" y="296">goal</text>
        <text x="270" y="296">blueprint</text>
        <text x="435" y="296">validate</text>
        <text x="609" y="296">export</text>
      </g>
      <g stroke="#8f7230" stroke-width="1.6">
        <path d="M180 291 H198"/>
        <path d="M336 291 H354"/>
        <path d="M510 291 H528"/>
      </g>
    </g>

    <g>
      <rect x="742" y="108" width="406" height="156" rx="16" fill="#101e31" stroke="#31507a"/>
      <text x="770" y="142" fill="#a9cbff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" letter-spacing="1.2">GUARDRAILS</text>
      <g fill="#c7d8ee" font-size="14">
        <text x="770" y="172">low-risk only · protected items never change</text>
        <text x="770" y="196">allowed-once host approval by default</text>
        <text x="770" y="220">snapshot before write · one-click rollback</text>
        <text x="770" y="244">read-only scan · no network / no !!js</text>
      </g>
      <circle cx="1120" cy="134" r="12" fill="none" stroke="#5eead4" stroke-width="2"/>
      <path d="M1114 134 L1118 138 L1126 129" fill="none" stroke="#5eead4" stroke-width="2"/>
    </g>
  </g>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#4b6a92"/>
    </marker>
  </defs>
</svg>
