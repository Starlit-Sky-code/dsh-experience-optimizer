<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">DSH Experience Optimizer</title>
  <desc id="desc">DSH plugin diet, compatibility diagnostics and workflow blueprints. Trim the noise. Keep the power.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1220"/>
      <stop offset="0.55" stop-color="#0d1728"/>
      <stop offset="1" stop-color="#101b2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="0.55" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.72" cy="0.38" r="0.55">
      <stop offset="0" stop-color="#60a5fa" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#60a5fa" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.1" fill="#93a8c8" opacity="0.13"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <rect width="1200" height="420" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="28" fill="url(#dots)"/>
  <rect width="1200" height="420" rx="28" fill="url(#glow)"/>
  <rect x="1" y="1" width="1198" height="418" rx="27" fill="none" stroke="#25344d" stroke-width="1.5"/>

  <!-- project-native constellation: plugins, context, approval -->
  <g opacity="0.95">
    <circle cx="930" cy="200" r="128" fill="none" stroke="#24344d" stroke-width="1"/>
    <circle cx="930" cy="200" r="86" fill="none" stroke="#2c3f5c" stroke-width="1"/>
    <path d="M850 150 L905 118 L984 142 L1013 214 L958 272 L872 248 Z" fill="none" stroke="#3b5578" stroke-width="1.4"/>
    <path d="M850 150 L958 272 M905 118 L872 248 M984 142 L850 150 M1013 214 L872 248" stroke="#314766" stroke-width="1" opacity="0.75"/>
    <g fill="#0f1b2c" stroke="#5eead4" stroke-width="1.8">
      <circle cx="850" cy="150" r="15"/>
      <circle cx="905" cy="118" r="15"/>
      <circle cx="984" cy="142" r="15"/>
      <circle cx="1013" cy="214" r="15"/>
      <circle cx="958" cy="272" r="15"/>
      <circle cx="872" cy="248" r="15"/>
    </g>
    <g fill="#d9f8f1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" text-anchor="middle">
      <text x="850" y="154">p</text><text x="905" y="122">ctx</text><text x="984" y="146">cfg</text>
      <text x="1013" y="218">ui</text><text x="958" y="276">tool</text><text x="872" y="252">run</text>
    </g>
    <circle cx="954" cy="198" r="47" fill="#0c1728" stroke="#fbbf24" stroke-width="1.6"/>
    <path d="M954 166 L976 176 L976 198 C976 214 966 225 954 230 C942 225 932 214 932 198 L932 176 Z" fill="none" stroke="#fbbf24" stroke-width="2"/>
    <path d="M944 196 L951 203 L965 188" fill="none" stroke="#fbbf24" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="954" y="255" fill="#ffd782" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" text-anchor="middle" letter-spacing="1">APPROVAL</text>
    <text x="1128" y="86" text-anchor="end" fill="#7f93b0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="1.4">CONTEXT / PLUGIN GRAPH</text>
  </g>

  <!-- copy -->
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', 'Noto Sans CJK SC', sans-serif">
    <text x="64" y="76" fill="#5eead4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" letter-spacing="3">DSH PLUGIN SUITE · v0.3.1</text>
    <text x="62" y="158" fill="#f2f7ff" font-size="58" font-weight="750" letter-spacing="-1.8">Experience Optimizer</text>
    <text x="64" y="204" fill="#c3d3e8" font-size="25">少一点插件负担，多一点兼容确定性。</text>
    <text x="64" y="238" fill="#8ea3be" font-size="18">Trim the noise. Keep the power.</text>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="1.2">
      <rect x="64" y="278" width="92" height="30" rx="15" fill="#0f2a2a" stroke="#2b6b64"/>
      <text x="110" y="298" fill="#8ff0d8" text-anchor="middle">TRIM</text>
      <rect x="166" y="278" width="154" height="30" rx="15" fill="#102036" stroke="#2d4f7c"/>
      <text x="243" y="298" fill="#a9cbff" text-anchor="middle">COMPATIBILITY</text>
      <rect x="330" y="278" width="94" height="30" rx="15" fill="#2a2313" stroke="#6b5522"/>
      <text x="377" y="298" fill="#ffd782" text-anchor="middle">RECIPE</text>
      <text x="64" y="350" fill="#7186a3" font-size="11" letter-spacing="0.8">HOST APPROVAL · SNAPSHOT ROLLBACK · FORMAT-1 MARKET INDEX</text>
    </g>
  </g>

  <path d="M64 376 H440" stroke="url(#accent)" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  <circle cx="440" cy="376" r="3.5" fill="#fbbf24"/>
</svg>
