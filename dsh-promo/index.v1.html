<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>dsh-experience-optimizer · 24s promo</title>
<link rel="stylesheet" href="./fonts/fonts.css">
<style>
  html, body { margin: 0; background: #05070c; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script type="module">
import { DUR, SHOTS, CUES, b, BEAT, BAR } from './timeline.js';
import { seg, lerp, clamp, ease, snap, glide, spring, springTo, stagger, pulse, shake, camera, stageSize, setupCanvas, loadFonts, loadImage, tween, hash, camera3d, drawBoxes } from './motion.js';
import { SANS, MONO, txt, measure, lines, rr, panel, spark, sparkPath, imageFrame, riseText, wipeText, dot, hairline, chip, fmt } from './art.js';

const { W, H } = stageSize();
const canvas = document.getElementById('c');
const ctx = setupCanvas(canvas, W, H);
const U = Math.min(W, H) / 1080;
const M = 96;

// ── palette ────────────────────────────────────────────────────────────────
const C = {
  bg0: '#05070C', bg1: '#0B1322', bg2: '#0E1828',
  ink: '#F2F5FA', mut: '#93A3B8', faint: '#5A6B82', ghost: '#3A485C',
  amber: '#F2A33A', amberHi: '#FFC46B', amberDeep: '#C87A1E',
  blue: '#8FB7FF', mint: '#9FE0C0', coral: '#FF7A66',
  line: 'rgba(255,255,255,0.10)', panelFill: 'rgba(13,22,38,0.78)',
};

// ── product data (example profile; token values sum to 2,417 and are labelled as an example in-frame) ──
const PLUGINS = [
  { id: 'voice', cn: '语音输入', en: 'voice-input', tok: 486, drop: true, why: 'usage 0 · 本任务不需要' },
  { id: 'rec', cn: '推荐卡片', en: 'recommendations', tok: 372, drop: true, why: '与本任务无关 · no session usage' },
  { id: 'forge', cn: '实验工具', en: 'forge-bundle', tok: 264, drop: true, why: 'workspace 无 Git 仓库' },
  { id: 'search', cn: '网页搜索', en: 'search-web', tok: 128, drop: true, why: '本任务不需要联网' },
  { id: 'export', cn: '文档导出', en: 'export-doc', tok: 62, drop: true, why: '本任务不导出文档' },
  { id: 'cua', cn: '桌面操作', en: 'cua-bundle', tok: 318 },
  { id: 'pa', cn: '插件 A', en: 'plugin-a', tok: 210 },
  { id: 'pb', cn: '插件 B', en: 'plugin-b', tok: 188 },
  { id: 'workdir', cn: '工作目录', en: 'tool-workdir', tok: 162 },
  { id: 'prompt', cn: '提示词包', en: 'prompt-pack', tok: 106 },
  { id: 'review', cn: '代码审查', en: 'code-review', tok: 92 },
  { id: 'memory', cn: '会话记忆', en: 'session-memory', tok: 29 },
];
const TOK_ALL = PLUGINS.reduce((a, p) => a + p.tok, 0);            // 2,417
const TOK_DROP = PLUGINS.filter(p => p.drop).reduce((a, p) => a + p.tok, 0); // 1,312
const KEPT = PLUGINS.filter(p => !p.drop);
const DROP_IDX = PLUGINS.map((p, i) => (p.drop ? i : -1)).filter(i => i >= 0);

// ── geometry ───────────────────────────────────────────────────────────────
const wallRect = i => ({ x: 500 + (i % 4) * 352, y: 356 + Math.floor(i / 4) * 100, w: 340, h: 86 });
const listRect = i => ({ x: 720, y: 168 + i * 58, w: 720, h: 52 });
const listCloseRect = j => ({ x: 720, y: 168 + j * 100, w: 720, h: 68 });
const dockRect = j => ({ x: M + j * 152, y: 948, w: 146, h: 48 });
const orbit = (j, t = 0) => orbitPt(j, t);
const dockIndex = id => KEPT.findIndex(p => p.id === id);
const keptSlot = id => PLUGINS.filter(p => !p.drop).findIndex(p => p.id === id);

const MAT = { x: 640, y: 168, w: 1184, h: 580 };
const BPR = { x: 640, y: 168, w: 1184, h: 560 };
const P = { x: 1120, y: 500 };           // signature point (constellation centre)
const CN = { cx: 1120, cy: 500, r: 330 };

// ── tiny helpers ───────────────────────────────────────────────────────────
const nowIn = (t, a, b2) => clamp(seg(t, a, b2));
const blink = (t, times, decay = 0.16) => pulse(t, times, decay);

function bg(t) {
  const g = ctx.createLinearGradient(0, 0, W * 0.35, H);
  g.addColorStop(0, C.bg0); g.addColorStop(0.55, C.bg1); g.addColorStop(1, '#0A1120');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // dot field
  ctx.save(); ctx.globalAlpha = 0.55;
  ctx.fillStyle = 'rgba(255,255,255,0.05)';
  const step = 32, ox = (t * 4) % step;
  for (let y = 16; y < H; y += step) for (let x = 16 - ox; x < W; x += step) ctx.fillRect(x, y, 1.6, 1.6);
  ctx.restore();
  // moving key light (upper-left) + cool fill (lower-right)
  const lx = W * 0.24 + Math.sin(t * 0.21) * 40, ly = H * 0.16 + Math.cos(t * 0.17) * 26;
  const warm = ctx.createRadialGradient(lx, ly, 0, lx, ly, W * 0.62);
  warm.addColorStop(0, 'rgba(242,163,58,0.13)'); warm.addColorStop(0.42, 'rgba(242,163,58,0.045)'); warm.addColorStop(1, 'rgba(242,163,58,0)');
  ctx.fillStyle = warm; ctx.fillRect(0, 0, W, H);
  const cool = ctx.createRadialGradient(W * 0.86, H * 0.9, 0, W * 0.86, H * 0.9, W * 0.55);
  cool.addColorStop(0, 'rgba(143,183,255,0.10)'); cool.addColorStop(1, 'rgba(143,183,255,0)');
  ctx.fillStyle = cool; ctx.fillRect(0, 0, W, H);
  // vignette
  const v = ctx.createRadialGradient(W / 2, H / 2, H * 0.36, W / 2, H / 2, H * 1.02);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.55)');
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
}

function eyebrow(t, alpha = 1) {
  const a = clamp(seg(t, 0.2, 0.7)) * alpha;
  if (a <= 0) return;
  ctx.save(); ctx.globalAlpha = a;
  dot(ctx, M + 4, 86, 3.4, C.amber);
  txt(ctx, 'DSH · EXPERIENCE OPTIMIZER', M + 18, 91, { size: 12, weight: 500, family: MONO, color: 'rgba(242,163,58,0.92)', track: 2.6 });
  ctx.restore();
}

function topStat(t, value, label, alpha = 1) {
  const a = clamp(seg(t, 0.5, 1.0)) * alpha;
  if (a <= 0) return;
  ctx.save(); ctx.globalAlpha = a;
  txt(ctx, label, W - M, 79, { size: 10, weight: 500, family: MONO, color: C.faint, track: 2.2, align: 'right' });
  txt(ctx, value, W - M, 100, { size: 22, weight: 700, family: MONO, color: C.ink, align: 'right', track: 0.5 });
  ctx.restore();
}

function checkMark(x, y, s, k, color = C.amber) {
  if (k <= 0.01) return;
  ctx.save(); ctx.strokeStyle = color; ctx.lineWidth = 2.2; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath();
  const p1 = [x - s * 0.42, y], p2 = [x - s * 0.1, y + s * 0.34], p3 = [x + s * 0.46, y - s * 0.36];
  const a = clamp(k * 2), b2 = clamp(k * 2 - 1);
  ctx.moveTo(p1[0], p1[1]); ctx.lineTo(lerp(p1[0], p2[0], a), lerp(p1[1], p2[1], a));
  if (b2 > 0) { ctx.moveTo(p2[0], p2[1]); ctx.lineTo(lerp(p2[0], p3[0], b2), lerp(p2[1], p3[1], b2)); }
  ctx.stroke(); ctx.restore();
}

function checkbox(x, y, s, k, color = C.amber) {
  ctx.save();
  rr(ctx, x, y, s, s, 5);
  ctx.fillStyle = `rgba(242,163,58,${0.08 + 0.14 * k})`; ctx.fill();
  ctx.strokeStyle = k > 0.05 ? color : 'rgba(255,255,255,0.22)'; ctx.lineWidth = 1.2; ctx.stroke();
  checkMark(x + s / 2, y + s / 2, s * 0.9, k, color);
  ctx.restore();
}

function tile(t, p, i, alphaScale = 1) {
  const w0 = wallRect(i), l = listRect(i);
  const isDrop = p.drop;
  const j = isDrop ? DROP_IDX.indexOf(i) : keptSlot(p.id);
  const d = dockRect(j);
  const enter = 0.03 + i * 0.038;
  const keys = [
    [-1, [w0.x + 460, w0.y + 6, w0.w * 0.94, w0.h * 0.94]],
    [enter, [w0.x, w0.y, w0.w, w0.h], { freq: 2.5, damp: 0.78 }],
    [2.0 + i * 0.016, [l.x, l.y, l.w, l.h], { freq: 2.35, damp: 0.78 }],
  ];
  if (isDrop) keys.push([3.7 + j * 0.06, [300, 470, 96, 30], { freq: 2.8, damp: 0.62 }]);
  else {
    keys.push([4.2 + j * 0.035, [listCloseRect(j).x, listCloseRect(j).y, listCloseRect(j).w, listCloseRect(j).h], { freq: 2.5, damp: 0.8 }]);
    keys.push([4.9 + j * 0.05, [d.x, d.y, d.w, d.h], { freq: 2.2, damp: 0.8 }]);
  }
  let [x, y, w, h] = springTo(t, keys);
  const orb = isDrop ? 0 : clamp(seg(t, 13.72 + j * 0.07, 14.45 + j * 0.07));
  if (orb > 0) {
    const [ox, oy] = orbit(j, t);
    const e = ease.inOutCubic(orb);
    x = lerp(x, ox - 7, e); y = lerp(y, oy - 7, e); w = lerp(w, 14, e); h = lerp(h, 14, e);
  }
  if (t > 17.9) {
    const k = ease.inCubic(clamp(seg(t, 17.9, 18.2)));
    x = lerp(x, P.x, k); y = lerp(y, P.y, k); w = lerp(w, 3, k); h = lerp(h, 3, k);
  }
  let a = clamp(seg(t, enter, enter + 0.22));
  if (isDrop) a *= 1 - glide(clamp(seg(t, 3.7 + j * 0.06, 4.3 + j * 0.06)));
  a *= alphaScale;
  if (t > 18.12) a *= 1 - clamp(seg(t, 18.12, 18.2));
  const contentFade = 1 - clamp(seg(t, 13.8 + j * 0.07, 14.2 + j * 0.07));
  if (a <= 0.004) return;

  const morphHide = t < 2.1 ? 1 - clamp(seg(t, 1.94, 2.08)) : clamp(seg(t, 2.22, 2.44));
  const rowFade = 1 - clamp(seg(t, 4.72 + j * 0.03, 4.94 + j * 0.03));
  const rowA = morphHide * rowFade;
  const dockA = isDrop ? 0 : clamp(seg(t, 5.3, 5.52));

  // card shell
  ctx.save(); ctx.globalAlpha = a;
  const tagged = isDrop && t > 2.55;
  rr(ctx, x, y, w, h, orb > 0.45 ? h / 2 : Math.min(12, h * 0.2));
  ctx.fillStyle = orb > 0.45 ? 'rgba(242,163,58,0.92)' : tagged ? 'rgba(242,163,58,0.075)' : 'rgba(255,255,255,0.045)';
  ctx.fill();
  const hit = t > 0.98 ? 1.02 + clamp((w0.x + w0.w / 2 - 470) / 1430) * 0.66 : 99;
  const flash = blink(t, [hit], 0.26);
  ctx.strokeStyle = orb > 0.45 ? 'rgba(255,214,150,0.5)' : flash > 0.04 ? `rgba(242,163,58,${0.18 + flash * 0.7})` : tagged ? 'rgba(242,163,58,0.36)' : 'rgba(255,255,255,0.10)';
  ctx.lineWidth = 1; ctx.stroke();

  const s = clamp(w / 720);
  const small = h < 70;
  const cA = contentFade;
  if (rowA > 0.02 && !small && cA > 0.02) {
    ctx.globalAlpha = a * rowA * cA;
    // checkbox + name + english
    const ck = clamp(seg(t, 2.55 + j * 0.25, 2.8 + j * 0.25));
    if (isDrop && t > 2.0) checkbox(x + 16, y + (h - 22) / 2, 22, ck); else dot(ctx, x + 27, y + h / 2, 4.5, isDrop && t > 2.55 ? C.amber : C.faint);
    txt(ctx, p.cn, x + (isDrop ? 50 : 44), y + (h > 62 ? 30 : 26), { size: 20, weight: 500, color: C.ink, track: 0.2 });
    txt(ctx, p.en, x + (isDrop ? 50 : 44), y + (h > 62 ? 49 : 43), { size: 10, weight: 400, family: MONO, color: C.faint, track: 0.6 });
    txt(ctx, `${p.tok}`, x + w - 28, y + (h > 62 ? 30 : 26), { size: 14, weight: 600, family: MONO, color: tagged ? C.amberHi : C.mut, align: 'right' });
    txt(ctx, 'tokens', x + w - 28, y + (h > 62 ? 49 : 43), { size: 9, weight: 400, family: MONO, color: C.ghost, align: 'right', track: 1 });
    if (tagged) chip(ctx, x + w - 236, y + (h - 26) / 2, '建议禁用', { h: 24, pad: 10, size: 11, color: C.amber, fill: 'rgba(242,163,58,0.14)', border: 'rgba(242,163,58,0.5)', textColor: C.amberHi, dotColor: C.amber });
  } else if (rowA > 0.02 && small && w > 280 && cA > 0.02) {
    ctx.globalAlpha = a * rowA * cA;
    dot(ctx, x + 17, y + h / 2, 4, tagged ? C.amber : C.faint);
    txt(ctx, p.cn, x + 30, y + h / 2 + 5, { size: 18, weight: 500, color: C.ink, track: 0.4 });
    txt(ctx, `${p.tok}`, x + w - 16, y + h / 2 + 4, { size: 12, weight: 600, family: MONO, color: tagged ? C.amberHi : C.faint, align: 'right' });
  }
  if (dockA > 0.02 && cA > 0.02) {
    ctx.globalAlpha = a * dockA * cA;
    dot(ctx, x + 15, y + h / 2, 3.4, C.amber);
    txt(ctx, p.cn, x + 27, y + h / 2 + 5, { size: 13, weight: 500, color: C.ink, track: 0.3 });
  }
  ctx.restore();

  // removal particles → token meter
  if (isDrop && t > 3.68) {
    const k = clamp(seg(t, 3.72 + j * 0.06, 4.32 + j * 0.06));
    if (k > 0 && k < 1) {
      ctx.save(); ctx.globalAlpha = (1 - k) * 0.8;
      for (let n = 0; n < 7; n++) {
        const seed = hash(i * 31 + n, 7);
        const sx = x + w / 2 + (seed - 0.5) * 60, sy = y + h / 2 + (hash(n + i, 3) - 0.5) * 30;
        const ex = 96 + 420 * (TOK_ALL - 900 - n * 66) / TOK_ALL, ey = 452 + (hash(n, 9) - 0.5) * 8;
        const kk = ease.inCubic(k);
        dot(ctx, lerp(sx, ex, kk), lerp(sy, ey, kk) - Math.sin(kk * Math.PI) * 40 * seed, 1.6 + seed * 1.6, C.amber, 1 - k);
      }
      ctx.restore();
    }
  }
}

function wallScan(t) {
  const a = clamp(seg(t, 0.98, 1.08)) * (1 - clamp(seg(t, 1.68, 1.95)));
  if (a <= 0.01) return;
  const y = lerp(250, 1010, glide(clamp(seg(t, 1.0, 1.66))));
  ctx.save(); ctx.globalAlpha = a;
  const g = ctx.createLinearGradient(0, y, 0, y + 90);
  g.addColorStop(0, 'rgba(242,163,58,0)'); g.addColorStop(0.35, 'rgba(242,163,58,0.20)'); g.addColorStop(1, 'rgba(242,163,58,0)');
  ctx.fillStyle = g; ctx.fillRect(0, y - 90, W, 180);
  hairline(ctx, 0, y, W, y, 'rgba(255,196,107,0.85)', 1.5, 0.9);
  ctx.restore();
}

function tokenMeter(t) {
  const a = clamp(seg(t, 2.0, 2.4)) * (1 - clamp(seg(t, 7.9, 8.2)));
  if (a <= 0.01) return;
  const tokens = TOK_ALL - TOK_DROP * glide(clamp(seg(t, 3.75, 4.7)));
  const wBar = 420 * tokens / TOK_ALL;
  ctx.save(); ctx.globalAlpha = a;
  txt(ctx, '可归属上下文', M, 421, { size: 11, weight: 500, family: MONO, color: C.faint, track: 1.6 });
  txt(ctx, `${fmt(tokens)} tokens`, M + 420, 421, { size: 12, weight: 600, family: MONO, color: tokens < TOK_ALL - 20 ? C.amberHi : C.mut, align: 'right', track: 0.4 });
  rr(ctx, M, 438, 420, 5, 2.5); ctx.fillStyle = 'rgba(255,255,255,0.09)'; ctx.fill();
  rr(ctx, M, 438, wBar, 5, 2.5); ctx.fillStyle = C.amber; ctx.fill();
  txt(ctx, '示例 profile', M, 470, { size: 9, weight: 400, family: MONO, color: C.ghost, track: 1.2 });
  ctx.restore();
}

function headline(t, linesArr, y0, size, k0, alpha = 1) {
  linesArr.forEach((s, i) => {
    const k = spring(t - (k0 + i * 0.09), { freq: 2.0, damp: 0.92 });
    riseText(ctx, s, M, y0 + i * size * 1.08, k, { size, weight: 900, color: C.ink, track: -size * 0.02, alpha: alpha * (i === 0 ? 1 : 1) });
  });
}

function subline(t, s, y, k0, alpha = 1, o = {}) {
  const k = clamp(seg(t, k0, k0 + 0.35));
  if (k <= 0) return;
  ctx.save(); ctx.globalAlpha = alpha * k;
  txt(ctx, s, M, y, { size: 18, weight: 400, family: MONO, color: C.mut, track: 1.2, ...o });
  ctx.restore();
}

function drawWeb(t, mul = 1) {
  const a = clamp(seg(t, 0.02, 0.55)) * (1 - clamp(seg(t, 1.8, 1.97))) * mul;
  if (a <= 0.01) return;
  const beamX = t > 1.0 ? lerp(470, 1900, ease.inOutSine(clamp(seg(t, 1.0, 1.7)))) : 9999;
  ctx.save(); ctx.globalAlpha = a;
  const centers = PLUGINS.map((p, i) => { const r = wallRect(i); return [r.x + r.w / 2, r.y + r.h / 2]; });
  for (let i = 0; i < 12; i++) {
    for (let k = 1; k <= 2; k++) {
      const j = (i + k * 3 + 1) % 12;
      if (j <= i) continue;
      const [x1, y1] = centers[i], [x2, y2] = centers[j];
      const bow = (hash(i * 7 + j, 21) - 0.5) * 260;
      const mx = (x1 + x2) / 2 + bow * 0.35, my = (y1 + y2) / 2 - Math.abs(bow) * 0.6;
      const cutA = clamp((beamX - Math.min(x1, x2)) / 220);
      ctx.strokeStyle = hash(i + j, 3) > 0.7 ? `rgba(242,163,58,${0.28 * cutA + 0.06})` : `rgba(170,198,255,${0.26 * cutA + 0.05})`;
      ctx.lineWidth = 1.1;
      ctx.beginPath(); ctx.moveTo(x1, y1); ctx.quadraticCurveTo(mx, my, x2, y2); ctx.stroke();
      // a live spark travelling the strand
      if (cutA > 0.2) {
        const f = (t * 0.5 + hash(i + j, 9)) % 1;
        const bx = (1 - f) * (1 - f) * x1 + 2 * (1 - f) * f * mx + f * f * x2;
        const by = (1 - f) * (1 - f) * y1 + 2 * (1 - f) * f * my + f * f * y2;
        dot(ctx, bx, by, 1.4, 'rgba(242,163,58,0.75)', cutA * 0.8);
      }
    }
  }
  // stray context strands
  for (let s = 0; s < 15; s++) {
    const y0 = 250 + hash(s, 31) * 520, y1 = 250 + hash(s, 32) * 520, y2 = 250 + hash(s, 33) * 520;
    ctx.strokeStyle = `rgba(170,198,255,${0.07 + hash(s, 34) * 0.07})`; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(470, y0); ctx.bezierCurveTo(900, y1, 1300, y2, 1900, y0 + (hash(s, 35) - 0.5) * 200); ctx.stroke();
  }
  // context labels
  const labels = [['context', 0.2], ['skills', 0.42], ['prompts', 0.62], ['tools', 0.8], ['hooks', 0.9]];
  labels.forEach(([s, f], i) => {
    if (t < 0.3 + i * 0.07) return;
    const x = 560 + f * 1180, y = 300 + hash(i, 41) * 420;
    txt(ctx, s, x, y, { size: 10, weight: 400, family: MONO, color: 'rgba(180,205,255,0.6)', track: 1.6 });
  });
  ctx.restore();
}

function cutBeam(t) {
  if (t < 1.0 || t > 1.75) return;
  const k = clamp(seg(t, 1.0, 1.7));
  const x = lerp(470, 1900, ease.inOutSine(k));
  const a = clamp(seg(t, 1.0, 1.06)) * (1 - clamp(seg(t, 1.62, 1.75)));
  if (a <= 0.01) return;
  ctx.save(); ctx.globalAlpha = a;
  const g = ctx.createLinearGradient(x - 80, 0, x + 80, 0);
  g.addColorStop(0, 'rgba(255,196,107,0)'); g.addColorStop(0.5, 'rgba(255,196,107,0.22)'); g.addColorStop(1, 'rgba(255,196,107,0)');
  ctx.fillStyle = g; ctx.fillRect(x - 80, 0, 160, H);
  hairline(ctx, x, 0, x, H, 'rgba(255,236,205,1)', 2, 1);
  hairline(ctx, x - 4, 0, x - 4, H, 'rgba(242,163,58,0.45)', 6, 0.55);
  dot(ctx, x, 0.5 * H, 5, 'rgba(255,240,215,0.95)');
  const tip = ctx.createRadialGradient(x, 0.5 * H, 0, x, 0.5 * H, 150);
  tip.addColorStop(0, 'rgba(255,220,170,0.35)'); tip.addColorStop(1, 'rgba(255,220,170,0)');
  ctx.fillStyle = tip; ctx.fillRect(x - 150, 0.5 * H - 150, 300, 300);
  ctx.restore();
}

// ── scene A: the stage ─────────────────────────────────────────────────────
function orbitPt(j, t = 0) {
  const a = -Math.PI / 2 + (j / 7) * Math.PI * 2 + 0.22 + (hash(j, 81) - 0.5) * 0.22 + Math.max(0, t - 13.6) * 0.052;
  const r = CN.r + (hash(j, 82) - 0.5) * 86;
  return [CN.cx + Math.cos(a) * r, CN.cy + Math.sin(a) * r];
}

function renderA(t) {
  bg(t);
  const sh = shake(t, [8.0, 18.2], 9, 0.22);
  const zoom = springTo(t, [[0, 1.055], [0.9, 1.0], [7.4, 1.0], [8.0, 1.026], [9.2, 1.0], [13.6, 1.0], [18.0, 1.0], [18.2, 1.03], [19.2, 1.0]], { freq: 1.9, damp: 0.9 });
  ctx.save();
  camera(ctx, W, H, { x: W / 2 + sh[0], y: H / 2 + sh[1], zoom, rot: sh[2] });

  eyebrow(t, 1 - clamp(seg(t, 19.3, 19.6)));

  // HOOK + TRIM: the 12 plugin tiles are the same objects all the way to the dock
  drawWeb(t);
  const listAlpha = 1 - 0.42 * clamp(seg(t, 4.9, 5.4));
  for (let i = 0; i < PLUGINS.length; i++) tile(t, PLUGINS[i], i, listAlpha);
  drawWeb(t, 0.65);
  cutBeam(t);

  // left column: the number 12 → 7
  const numIn = clamp(seg(t, 0.15, 0.5));
  const numSize = springTo(t, [[0, 196], [1.95, 196], [2.5, 84]], { freq: 2.2, damp: 0.86 });
  const numV = tween(t, [[2.15, 12], [4.2, 7]], glide);
  if (t < 8.0) {
    ctx.save(); ctx.globalAlpha = numIn * (1 - clamp(seg(t, 5.4, 5.7)));
    txt(ctx, String(Math.round(numV)), M - 4, 340, { size: numSize, weight: 800, family: MONO, color: C.ink, track: -numSize * 0.04 });
    txt(ctx, '启用插件 / ENABLED', M, 372 + (numSize > 120 ? 22 : 0), { size: 11, weight: 500, family: MONO, color: C.amber, track: 2.2 });
    ctx.restore();
  }
  // hook copy
  const hookA = clamp(seg(t, 0.5, 0.9)) * (1 - clamp(seg(t, 1.9, 2.15)));
  if (hookA > 0.01) {
    ctx.save(); ctx.globalAlpha = hookA;
    txt(ctx, '多装一个插件，', M, 470, { size: 27, weight: 400, color: C.mut, track: 0.4 });
    txt(ctx, '就多一份上下文成本。', M, 508, { size: 27, weight: 400, color: C.mut, track: 0.4 });
    ctx.restore();
  }

  tokenMeter(t);

  // claim 1
  if (t > 5.6 && t < 8.05) {
    const out = 1 - clamp(seg(t, 7.45, 7.85));
    headline(t, ['少一点', '插件负担'], 690, 104, 5.7, out);
    ctx.save(); ctx.globalAlpha = out;
    subline(t, '先建议，后确认，可回滚。', 842, 6.4, out * 0.9);
    ctx.restore();
  }

  // COMPAT panel
  if (t > 7.9 && t < 12.9) matrixPanel(t);
  // claim 2
  if (t > 10.2 && t < 13.65) {
    const out = 1 - clamp(seg(t, 13.2, 13.55));
    headline(t, ['多一点', '兼容确定性'], 592, 96, 10.3, out);
    ctx.save(); ctx.globalAlpha = out;
    subline(t, '插件 × 插件 · 插件 × DSH · Profile / 工作区', 748, 10.95, out * 0.9, { size: 15, track: 0.6 });
    ctx.restore();
  }

  // AFTER: the seven kept plugins orbit the mark
  constellation(t);

  // SIGNATURE spark
  sparkAct(t);

  // END CARD
  endCard(t);

  ctx.restore();

  const top = ctx.createLinearGradient(0, 0, 0, 140);
  top.addColorStop(0, 'rgba(255,255,255,0.035)'); top.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = top; ctx.fillRect(0, 0, W, 140);
}

function constellation(t) {
  if (t < 13.55 || t > 18.25) return;
  const a = clamp(seg(t, 13.6, 14.0)) * (1 - clamp(seg(t, 17.9, 18.2)));
  if (a <= 0.004) return;

  // faint star field around the mark
  ctx.save(); ctx.globalAlpha = a * 0.8;
  for (let i = 0; i < 26; i++) {
    const ang = hash(i, 71) * Math.PI * 2, rad = 200 + hash(i, 72) * 460;
    dot(ctx, CN.cx + Math.cos(ang) * rad, CN.cy + Math.sin(ang) * rad * 0.72, 0.7 + hash(i, 73) * 1.4, '#C9D6F2', 0.12 + hash(i, 74) * 0.3);
  }
  ctx.restore();

  // orbit ring + chords
  ctx.save(); ctx.globalAlpha = a;
  for (let i = 0; i < 7; i++) {
    const k = clamp(seg(t, 14.2 + i * 0.13, 14.75 + i * 0.13));
    if (k <= 0) continue;
    const [x1, y1] = orbitPt(i, t), [x2, y2] = orbitPt((i + 1) % 7, t);
    const mx = (x1 + x2) / 2 + (CN.cx - (x1 + x2) / 2) * 0.18, my = (y1 + y2) / 2 + (CN.cy - (y1 + y2) / 2) * 0.18;
    ctx.strokeStyle = 'rgba(242,163,58,0.34)'; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(x1, y1);
    ctx.quadraticCurveTo(mx, my, lerp(x1, x2, k), lerp(y1, y2, k));
    ctx.stroke();
    // a kept plugin's signal travelling the cord
    if (k > 0.98) {
      const f = (t * 0.32 + hash(i, 85)) % 1;
      const bx = (1 - f) * (1 - f) * x1 + 2 * (1 - f) * f * mx + f * f * x2;
      const by = (1 - f) * (1 - f) * y1 + 2 * (1 - f) * f * my + f * f * y2;
      dot(ctx, bx, by, 1.8, C.amberHi, 0.55);
    }
  }
  // three radial threads into the mark
  for (let i = 0; i < 3; i++) {
    const k = clamp(seg(t, 14.6 + i * 0.2, 15.1 + i * 0.2));
    if (k <= 0) continue;
    const [x1, y1] = orbitPt(i * 2 + 1, t);
    const dx = CN.cx - x1, dy = CN.cy - y1, d = Math.hypot(dx, dy);
    const ex = CN.cx - dx / d * 152, ey = CN.cy - dy / d * 152;
    ctx.strokeStyle = 'rgba(143,183,255,0.22)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(lerp(x1, ex, k), lerp(y1, ey, k)); ctx.stroke();
  }
  ctx.restore();

  // the mark: avatar in a ring, like the poster's AFTER side
  const ik = spring(t - 14.25, { freq: 1.7, damp: 0.9 });
  if (ik > 0.01) {
    const r = 140 * clamp(ik);
    ctx.save(); ctx.globalAlpha = a * clamp(ik);
    const glow = ctx.createRadialGradient(CN.cx, CN.cy, r * 0.5, CN.cx, CN.cy, r * 2.4);
    glow.addColorStop(0, 'rgba(242,163,58,0.10)'); glow.addColorStop(1, 'rgba(242,163,58,0)');
    ctx.fillStyle = glow; ctx.fillRect(CN.cx - r * 2.4, CN.cy - r * 2.4, r * 4.8, r * 4.8);
    ctx.save();
    ctx.beginPath(); ctx.arc(CN.cx, CN.cy, r, 0, Math.PI * 2); ctx.clip();
    const sz = r * 2;
    ctx.drawImage(IMG.icon, CN.cx - r, CN.cy - r, sz, sz);
    ctx.restore();
    ctx.strokeStyle = 'rgba(242,163,58,0.55)'; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.arc(CN.cx, CN.cy, r, 0, Math.PI * 2); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,0.10)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(CN.cx, CN.cy, r + 9, 0, Math.PI * 2); ctx.stroke();
    // slow orbit ticks around the mark
    ctx.save(); ctx.translate(CN.cx, CN.cy); ctx.rotate(t * 0.10);
    ctx.strokeStyle = 'rgba(242,163,58,0.32)'; ctx.lineWidth = 1; ctx.setLineDash([2, 15]);
    ctx.beginPath(); ctx.arc(0, 0, r + 30, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
    // breathing pulse
    const br = 0.5 + 0.5 * Math.sin((t - 14.2) * 1.6);
    ctx.strokeStyle = `rgba(242,163,58,${0.06 + 0.10 * br})`; ctx.lineWidth = 8;
    ctx.beginPath(); ctx.arc(CN.cx, CN.cy, r + 2, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
  }

  // left column: what "kept" means
  const stats = [
    ['只读体检', '只扫描、不执行、不改插件'],
    ['低风险才应用', '受保护项永不改动'],
    ['一键回滚', '快照在手，随时恢复'],
  ];
  ctx.save(); ctx.globalAlpha = a;
  wipeText(ctx, 'AFTER', M, 300, clamp(seg(t, 13.7, 14.0)), { size: 11, weight: 500, color: C.amber, track: 3 });
  const nk = spring(t - 13.75, { freq: 1.7, damp: 0.95 });
  riseText(ctx, '7 / 12', M - 4, 412, nk, { size: 92, weight: 800, family: MONO, color: C.ink, track: -3 });
  txt(ctx, 'KEPT · 保留', M, 448, { size: 11, weight: 500, family: MONO, color: C.faint, track: 2.2 });
  hairline(ctx, M, 492, M + 430, 492, 'rgba(255,255,255,0.12)', 1, a);
  stats.forEach(([k, d], i) => {
    const kk = clamp(seg(t, 14.55 + i * 0.18, 14.9 + i * 0.18));
    if (kk <= 0) return;
    ctx.globalAlpha = a * kk;
    const yy = 552 + i * 80 + 16 * (1 - kk);
    dot(ctx, M + 5, yy - 8, 3.2, i === 0 ? C.blue : i === 1 ? C.amber : C.mint);
    txt(ctx, k, M + 22, yy, { size: 24, weight: 600, color: C.ink, track: 0.4 });
    txt(ctx, d, M + 22, yy + 24, { size: 13, weight: 400, color: C.faint, track: 0.4 });
  });
  ctx.restore();
}

function panelShell(t, tIn, tOut, T) {
  const kIn = spring(t - tIn, { freq: 1.85, damp: 0.86 });
  const kOut = ease.inCubic(clamp(seg(t, tOut, tOut + 0.42)));
  const D0 = { x: M, y: 948, w: 1058, h: 48 };
  let x = lerp(D0.x, T.x, kIn), y = lerp(D0.y, T.y, kIn), w = lerp(D0.w, T.w, kIn), h = lerp(D0.h, T.h, kIn);
  x = lerp(x, D0.x, kOut); y = lerp(y, D0.y, kOut); w = lerp(w, D0.w, kOut); h = lerp(h, D0.h, kOut);
  return { x, y, w, h, a: t >= tIn ? (1 - kOut) : 0, kOut };
}

function matrixPanel(t) {
  if (t < 7.92 || t > 13.5) return;
  const sh = panelShell(t, 7.94, 12.12, MAT);
  if (sh.a <= 0.004) return;
  const ca = clamp(seg(t, 8.26, 8.55)) * sh.a;
  const fx = MAT.x, fy = MAT.y, fw = MAT.w, fh = MAT.h;

  ctx.save(); ctx.globalAlpha = sh.a;
  panel(ctx, sh.x, sh.y, sh.w, sh.h, { fill: 'rgba(10,18,32,0.86)', stroke: 'rgba(255,255,255,0.14)', r: 22, shadow: 'rgba(0,0,0,0.55)' });
  hairline(ctx, sh.x + 26, sh.y + 1, sh.x + sh.w - 26, sh.y + 1, 'rgba(255,196,107,0.20)', 1);
  ctx.restore();

  if (ca <= 0.004) return;
  ctx.save(); ctx.globalAlpha = ca;

  const gl = ctx.createLinearGradient(fx, fy, fx, fy + 140);
  gl.addColorStop(0, 'rgba(255,255,255,0.035)'); gl.addColorStop(1, 'rgba(255,255,255,0)');

  txt(ctx, '示例 profile', fx + fw - 32, fy + 74, { size: 10, weight: 400, family: MONO, color: C.ghost, align: 'right', track: 0.8 });

  const nE = Math.round(tween(t, [[8.3, 0], [9.1, 1]], glide));
  const nW = Math.round(tween(t, [[8.45, 0], [9.4, 2]], glide));
  const bw = 128;
  rr(ctx, fx + fw - 32 - bw, fy + 88, bw, 38, 19);
  ctx.fillStyle = 'rgba(255,122,102,0.12)'; ctx.fill();
  ctx.strokeStyle = 'rgba(255,122,102,0.4)'; ctx.lineWidth = 1; ctx.stroke();
  dot(ctx, fx + fw - 32 - bw + 20, fy + 107, 4, C.coral);
  txt(ctx, `${nE}E · ${nW}W`, fx + fw - 32 - bw + 34, fy + 112, { size: 13, weight: 600, family: MONO, color: '#FFB3A6', track: 0.6 });

  const rows = [
    { scope: 'PLUGIN × RUNTIME', code: 'RT_PLATFORM_UNSUPPORTED', detail: 'dsh-cua-bundle 不支持当前平台', fix: 'disable the optional bundle on this platform', kind: 'E' },
    { scope: 'PLUGIN × PLUGIN', code: 'PP_DUPLICATE_PROMPT', detail: '3 个插件注入重叠的 context section', fix: 'keep one owner and disable the duplicate section', kind: 'W' },
    { scope: 'PROFILE / WORKSPACE', code: 'WS_PATH_OVERLAP', detail: 'workspace instructions 与 profile 层重叠', fix: 'move the overlap into one layer', kind: 'W' },
  ];
  rows.forEach((r, i) => {
    const k = clamp(seg(t, 8.32 + i * 0.22, 8.74 + i * 0.22));
    if (k <= 0) return;
    const ry = fy + 128 + i * 116;
    const rx = fx + 32 + 40 * (1 - k);
    ctx.save(); ctx.globalAlpha = ca * k;
    rr(ctx, rx, ry, fw - 64, 100, 12);
    ctx.fillStyle = 'rgba(255,255,255,0.030)'; ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.08)'; ctx.lineWidth = 1; ctx.stroke();
    const col = r.kind === 'E' ? C.coral : C.amber;
    dot(ctx, rx + 26, ry + 30, 4.5, col);
    txt(ctx, r.scope, rx + 44, ry + 27, { size: 10, weight: 500, family: MONO, color: C.faint, track: 1.8 });
    txt(ctx, r.code, rx + 44, ry + 54, { size: 17, weight: 600, family: MONO, color: col === C.coral ? '#FFB3A6' : C.amberHi, track: 0.4 });
    txt(ctx, r.detail, rx + 44, ry + 79, { size: 14, weight: 400, color: C.mut, track: 0.3 });
    txt(ctx, 'FIX', rx + fw - 64 - 20, ry + 38, { size: 9, weight: 500, family: MONO, color: C.ghost, align: 'right', track: 1.6 });
    txt(ctx, r.fix, rx + fw - 64 - 20, ry + 58, { size: 10.5, weight: 400, family: MONO, color: C.mut, align: 'right', track: 0.2 });
    const sk = clamp(seg(t, 9.7 + i * 0.24, 10.2 + i * 0.24));
    if (sk > 0 && sk < 1) {
      ctx.globalAlpha = ca * k * (1 - sk) * 0.9;
      const hx = rx + (fw - 64) * glide(sk);

      hg.addColorStop(0, 'rgba(242,163,58,0)'); hg.addColorStop(1, 'rgba(242,163,58,0.35)');
      ctx.fillStyle = hg; ctx.fillRect(hx - 90, ry, 90, 100);
      hairline(ctx, hx, ry, hx, ry + 100, 'rgba(255,196,107,0.7)', 1, 0.9);

  txt(ctx, '+ 3 info · 每条冲突都有修复建议，不修改第三方源码', fx + 32, fy + fh - 30, { size: 10.5, weight: 400, family: MONO, color: C.ghost, track: 0.8 });
  ctx.restore();
}

function sparkAct(t) {
  if (t < 18.2) return;
  const burst = spring(t - 18.2, { freq: 2.15, damp: 0.62 });
  const fly = clamp(seg(t, 18.95, 19.5));
  const sx = lerp(P.x, 1768, ease.inOutCubic(fly));
  const sy = lerp(P.y, 300, ease.inOutCubic(fly));
  const r = lerp(150 * burst, 52, ease.inOutCubic(fly));
  const a = clamp(seg(t, 18.2, 18.28));
  ctx.save(); ctx.globalAlpha = a;
  const fl = Math.exp(-(t - 18.2) / 0.13);
  if (fl > 0.01) {
    const fg = ctx.createRadialGradient(sx, sy, 0, sx, sy, 460);
    fg.addColorStop(0, `rgba(255,214,150,${0.75 * fl})`); fg.addColorStop(0.4, `rgba(242,163,58,${0.25 * fl})`); fg.addColorStop(1, 'rgba(242,163,58,0)');
    ctx.fillStyle = fg; ctx.fillRect(0, 0, W, H);
  }
  const hg = ctx.createRadialGradient(sx, sy, 0, sx, sy, 300);
  hg.addColorStop(0, 'rgba(242,163,58,0.25)'); hg.addColorStop(0.5, 'rgba(242,163,58,0.06)'); hg.addColorStop(1, 'rgba(242,163,58,0)');
  ctx.fillStyle = hg; ctx.fillRect(sx - 320, sy - 320, 640, 640);
  const age = clamp(seg(t, 18.2, 18.9));
  if (t > 18.2 && t < 19.05) {
    const k = Math.min(1, age / 0.62), fade = 1 - k;
    ctx.save(); ctx.globalAlpha = fade * 0.55;
    ctx.strokeStyle = 'rgba(255,196,107,0.8)'; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.arc(P.x, P.y, 110 + 430 * ease.outCubic(k), 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
    ctx.save();
    for (let i = 0; i < 30; i++) {
      const ang = (i / 30) * Math.PI * 2 + 0.12;
      const r1 = 120 + 420 * ease.outCubic(k) + hash(i, 3) * 120;
      const r2 = r1 + (90 + hash(i, 8) * 220) * fade;
      ctx.globalAlpha = fade * (0.18 + hash(i, 5) * 0.35);
      hairline(ctx, P.x + Math.cos(ang) * r1, P.y + Math.sin(ang) * r1, P.x + Math.cos(ang) * r2, P.y + Math.sin(ang) * r2, 'rgba(255,196,107,0.9)', 1);
    }
    ctx.restore();
  }
  spark(ctx, sx, sy, Math.max(0, r), C.amber, Math.sin(t * 0.4) * 0.06);
  spark(ctx, sx, sy, Math.max(0, r * 0.36), C.amberHi, -Math.sin(t * 0.4) * 0.06);
  const sa = clamp(seg(t, 18.45, 18.72)) * (1 - clamp(seg(t, 18.95, 19.2)));
  if (sa > 0.01) {
    ctx.save(); ctx.globalAlpha = sa;
    txt(ctx, '把杂乱，剪成星光。', P.x, P.y + 246, { size: 44, weight: 700, color: C.ink, align: 'center', track: 0.6 });
    txt(ctx, 'TRIM THE NOISE · KEEP THE STARS', P.x, P.y + 288, { size: 11, weight: 500, family: MONO, color: 'rgba(242,163,58,0.8)', align: 'center', track: 3.2 });
    ctx.restore();
  }
  ctx.restore();
}

function endCard(t) {
  if (t < 19.2) return;
  const k = clamp(seg(t, 19.2, 19.6));
  const a = k;
  ctx.save(); ctx.globalAlpha = a;
  for (let i = 0; i < 54; i++) {
    const sx = hash(i, 61) * W, sy = hash(i, 62) * H;
    const tw = 0.35 + 0.65 * Math.abs(Math.sin(t * (0.5 + hash(i, 63)) + i));
    dot(ctx, sx, sy, 0.7 + hash(i, 64) * 1.5, hash(i, 65) > 0.8 ? C.amber : '#C9D6F2', 0.10 + tw * 0.35);
  }
  const cons = [[1768, 300], [1606, 224], [1452, 262], [1352, 372], [1408, 500], [1560, 558], [1698, 470]];
  ctx.save();
  ctx.strokeStyle = 'rgba(143,183,255,0.22)'; ctx.lineWidth = 1;
  for (let i = 0; i < cons.length; i++) {
    const [x1, y1] = cons[i], [x2, y2] = cons[(i + 1) % cons.length];
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  }
  cons.forEach(([x, y], i) => {
    if (i === 0) return;
    dot(ctx, x, y, 2.2 + (i % 3), 'rgba(201,214,242,0.55)');
  });
  ctx.restore();
  const wg = ctx.createRadialGradient(180, 360, 0, 180, 360, 460);
  wg.addColorStop(0, 'rgba(242,163,58,0.10)'); wg.addColorStop(1, 'rgba(242,163,58,0)');
  ctx.fillStyle = wg; ctx.fillRect(0, 0, W, H);

  const ik = spring(t - 19.22, { freq: 2.0, damp: 0.88 });
  ctx.save();
  ctx.globalAlpha = a * clamp(ik);
  const iy = 268 + 20 * (1 - clamp(ik));
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,0.6)'; ctx.shadowBlur = 40; ctx.shadowOffsetY = 14;
  rr(ctx, M, iy, 150, 150, 38); ctx.fillStyle = '#0A111F'; ctx.fill();
  ctx.restore();
  imageFrame(ctx, IMG.icon, M, iy, 150, 150, 38, 1);
  rr(ctx, M, iy, 150, 150, 38); ctx.strokeStyle = 'rgba(255,255,255,0.18)'; ctx.lineWidth = 1.2; ctx.stroke();
  ctx.restore();

  const x = 300;
  wipeText(ctx, 'DSH EXPERIENCE OPTIMIZER', x, 306, clamp(seg(t, 19.3, 19.55)), { size: 12, weight: 500, color: C.amber, track: 2.8 });
  wipeText(ctx, 'dsh-plugin-trim', x, 366, clamp(seg(t, 19.3, 19.6)), { size: 42, weight: 800, family: MONO, color: C.ink, track: -1 });
  const hk = spring(t - 19.34, { freq: 1.7, damp: 0.95 });
  riseText(ctx, '轻一点，走得更远。', x, 446, hk, { size: 54, weight: 700, color: C.ink, track: 0.4 });
  const sl = clamp(seg(t, 19.5, 19.85));
  ctx.save(); ctx.globalAlpha = a * sl;
  txt(ctx, '少一点插件负担，多一点兼容确定性。', x, 486, { size: 18, weight: 400, color: C.mut, track: 0.4 });
  ctx.restore();

  const chips = [['只读体检', C.blue], ['低风险才应用', C.amber], ['一键回滚', C.mint]];
  let cx = x;
  chips.forEach(([label, col], i) => {
    const ca = clamp(seg(t, 19.6 + i * 0.08, 19.85 + i * 0.08));
    if (ca <= 0) return;
    ctx.save(); ctx.globalAlpha = a * ca;
    const w = chip(ctx, cx, 512, label, { h: 32, pad: 12, size: 12, family: SANS, color: col, fill: 'rgba(255,255,255,0.04)', border: 'rgba(255,255,255,0.14)', textColor: '#DCE4F0', dotColor: col, track: 0.4 });
    ctx.restore();
    cx += w + 10;
  });

  const dl = clamp(seg(t, 19.65, 20.0));
  ctx.save(); ctx.globalAlpha = a * dl;
  hairline(ctx, x, 586, W - M, 586, 'rgba(255,255,255,0.12)', 1);
  txt(ctx, 'dsh-plugin-trim   ·   v0.2.7', x, 626, { size: 16, weight: 500, family: MONO, color: C.mut, track: 0.8 });
  txt(ctx, 'github.com/Starlit-Sky-code/dsh-experience-optimizer', x, 662, { size: 16, weight: 400, family: MONO, color: C.faint, track: 0.2 });
  txt(ctx, 'MIT   ·   DSH 0.2.2-rc.1   ·   受保护项永不改动', x, 698, { size: 13, weight: 400, family: MONO, color: C.ghost, track: 1 });
  ctx.restore();

  ctx.restore();
}

// ── images + boot ──────────────────────────────────────────────────────────
const IMG = {};
async function boot() {
  IMG.icon = await loadImage('assets/icon.png');
  IMG.ui = await loadImage('assets/ui-preview.png');
  // Force every declared @font-face subset to load before READY (CJK is split into many unicode ranges).
  await Promise.all(Array.from(document.fonts, f => f.load().catch(() => null)));
  await document.fonts.ready;
}
window.DUR = DUR;
window.render = t => {
  ctx.save();
  renderA(t);
  ctx.restore();
};

await boot();
window.render(0);
window.READY = true;
</script>
